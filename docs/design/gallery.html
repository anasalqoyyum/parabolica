<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;background:transparent;color:var(--foreground);font:13px var(--font-sans)}nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.preview-modes{display:flex;align-items:center;gap:6px;margin-bottom:10px}.preview-modes span{font-size:11px;color:var(--foreground);margin-right:4px}button{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);border-radius:var(--radius);padding:7px 9px;cursor:pointer}button[aria-selected="true"],button[aria-pressed="true"]{color:var(--primary-foreground);background:var(--primary);border-color:var(--primary)}button:focus-visible,a:focus-visible{outline:2px solid var(--ring);outline-offset:3px}figure{margin:0}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}figcaption{font-size:12px;line-height:1.6;color:var(--foreground);margin-top:9px}a{color:var(--primary);text-underline-offset:3px}.note{font-size:11px;color:var(--foreground);margin:8px 0 0}</style></head><body><nav role="tablist" aria-label="Updated music player designs"><button role="tab" id="tab-library" aria-selected="false" onclick="pickScreen('library')">Albums</button><button role="tab" id="tab-album" aria-selected="false" onclick="pickScreen('album')">Album</button><button role="tab" id="tab-scanner" aria-selected="false" onclick="pickScreen('scanner')">ReplayGain</button><button role="tab" id="tab-signal" aria-selected="false" onclick="pickScreen('signal')">Signal path</button><button role="tab" id="tab-settings" aria-selected="false" onclick="pickScreen('settings')">Sources</button><button role="tab" id="tab-listening" aria-selected="false" onclick="pickScreen('listening')">Listening device</button><button role="tab" id="tab-appearance" aria-selected="true" onclick="pickScreen('appearance')">Appearance</button></nav><div class="preview-modes" aria-label="Preview theme"><span>Preview theme</span><button id="mode-dark" aria-pressed="false" onclick="pickMode('dark')">Dark</button><button id="mode-light" aria-pressed="true" onclick="pickMode('light')">Light</button></div><figure id="library-light" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-library-concise-20261106.png" alt="Parabolica Albums, light theme"><figcaption>The same artwork-led collection in light and dark. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=MEa1E_TS4x" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="album-light" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-album-concise-20261106.png" alt="Parabolica Album, light theme"><figcaption>Local FLAC, album ReplayGain and the persistent player. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=28B5YbgdAq" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="scanner-light" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-scanner-concise-20261106.png" alt="Parabolica ReplayGain, light theme"><figcaption>Track and album gain results with an explicit save destination. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=SiHuLDUKLQ" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="signal-light" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-signal-concise-20261106.png" alt="Parabolica Signal path, light theme"><figcaption>ASIO output, active ReplayGain, source-rate playback and hardware uncertainty. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=JUMRy7HkD_" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="settings-light" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-settings-concise-20261106.png" alt="Parabolica Sources, light theme"><figcaption>Local folders, an experimental streaming account and the selected ASIO path. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=iaAnLYtxOn" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="listening-light" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-listening-concise-20261106.png" alt="Parabolica Listening device, light theme"><figcaption>FiiO K3 driver, backend, channels, negotiated format and buffer information. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=v6rsM8wkiS" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="appearance-light"><img src="/home/anas/Pictures/Screenshots/parabolica-appearance-concise-20261106.png" alt="Parabolica Appearance, light theme"><figcaption> <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=AwqtZ6bXM6" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="library-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-library-dark-concise-20261106.png" alt="Parabolica Albums, dark theme"><figcaption>The same artwork-led collection in light and dark. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=Ql2mDnh2V6" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="album-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-album-dark-concise-20261106.png" alt="Parabolica Album, dark theme"><figcaption>Local FLAC, album ReplayGain and the persistent player. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=ySa1MFEyrY" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="scanner-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-scanner-dark-concise-20261106.png" alt="Parabolica ReplayGain, dark theme"><figcaption>Track and album gain results with an explicit save destination. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=sGdl2HHDGa" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="signal-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-signal-dark-concise-20261106.png" alt="Parabolica Signal path, dark theme"><figcaption>ASIO output, active ReplayGain, source-rate playback and hardware uncertainty. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=9eUKiSSvM0" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="settings-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-settings-dark-concise-20261106.png" alt="Parabolica Sources, dark theme"><figcaption>Local folders, an experimental streaming account and the selected ASIO path. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=a8v12B7zbH" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="listening-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-listening-dark-concise-20261106.png" alt="Parabolica Listening device, dark theme"><figcaption>FiiO K3 driver, backend, channels, negotiated format and buffer information. <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=h2j2D-Yndg" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><figure id="appearance-dark" hidden><img src="/home/anas/Pictures/Screenshots/parabolica-appearance-dark-concise-20261106.png" alt="Parabolica Appearance, dark theme"><figcaption> <a href="https://en.pipefish-sirius.ts.net:8443/c/yw3yVRBewS?frame=l42qoG9mGI" target="_blank" rel="noopener">Open full-size design</a></figcaption></figure><p class="note">Proposed Windows UI · Illustrative FiiO driver and stream values</p><script>let screen='appearance',mode='light';function sync(){document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!==screen+'-'+mode);document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.id==='tab-'+screen)));['light','dark'].forEach(m=>document.getElementById('mode-'+m).setAttribute('aria-pressed',String(m===mode)))}function pickScreen(k){screen=k;sync()}function pickMode(k){mode=k;sync()}</script></body></html>
